    .pc-stage{display:grid;grid-template-columns:1fr 1fr;gap:16px}.pc-placeholder{display:flex;min-height:371px;align-items:center;justify-content:center;flex-direction:column;gap:6px;border-radius:12px;background:#fff;color:#94a0a7}.pc-widget{min-width:0}.widget-main{display:block;min-height:0}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:0;border-bottom:1px solid var(--line)}.metric{height:82px;align-items:center;justify-content:center;flex-direction:column;gap:4px;padding:0 7px;border-right:1px solid #dcefe8;border-bottom:0;text-align:center}.metric:last-child{border-right:0}.metric b{font-size:23px}.survey-list{padding:7px 14px}.survey-row,.survey-head{grid-template-columns:minmax(140px,1.4fr) 75px minmax(95px,.85fr) 115px;gap:8px}.survey-row{min-height:58px}.mobile-title{margin-bottom:3px}.mobile-explain{margin:0 0 12px 2px;color:#fff;font-size:11px;opacity:.9}.mobile-card.stats-only{padding:0;cursor:default}.mobile-stat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:30px 7px;background:linear-gradient(135deg,#effbf7,#fff)}.mobile-stat-grid div{display:flex;min-width:0;align-items:center;justify-content:center;flex-direction:column;gap:7px;border-right:1px solid #dcefe8;text-align:center}.mobile-stat-grid div:last-child{border:0}.mobile-stat-grid b{max-width:100%;overflow:hidden;color:var(--green-dark);font-size:23px;text-overflow:ellipsis;white-space:nowrap}.mobile-stat-grid span{max-width:100%;overflow:hidden;color:#70817a;font-size:10px;text-overflow:ellipsis;white-space:nowrap}@media(max-width:1050px){.pc-stage{grid-template-columns:1fr}.pc-placeholder{display:none}.pc-widget{min-width:0!important}}@media(max-width:900px){.pc-widget{min-width:650px}.pc-stage{display:block}}
    .widget-actions,.mobile-title-row{display:flex;align-items:center;gap:12px}.mobile-title-row{justify-content:space-between}.prd-btn{height:24px;padding:0 8px;border:1px solid #c9e8de;border-radius:5px;background:#f2fbf8;color:#159c75;font-size:10px;cursor:pointer}.prd-mask{position:fixed;inset:0;z-index:99;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(13,29,38,.56)}.prd-mask.show{display:flex}.prd-dialog{width:min(980px,96vw);max-height:90vh;overflow:auto;border-radius:14px;background:#fff;box-shadow:0 20px 70px rgba(0,0,0,.3)}.prd-dialog>header{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line);background:#fff}.prd-dialog h2{margin:0;font-size:20px}.prd-dialog header small{color:var(--muted)}.prd-close{width:32px;height:32px;border:0;border-radius:50%;background:#edf3f1;color:#52646e;font-size:22px;cursor:pointer}.prd-body{padding:20px 22px}.prd-note{padding:13px 15px;border-left:4px solid var(--green);border-radius:7px;background:var(--green-soft)}.prd-body h3{margin:22px 0 9px;font-size:16px}.prd-body table{width:100%;border-collapse:collapse;font-size:12px}.prd-body th,.prd-body td{padding:9px 10px;border:1px solid var(--line);vertical-align:top;text-align:left}.prd-body th{background:#f3f7f6}.prd-body pre{overflow:auto;margin:0;border-radius:8px;background:#17232b;color:#d9f7ed;padding:13px;font:11px/1.5 Consolas,monospace;white-space:pre-wrap}.prd-code{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:650px){.prd-mask{padding:8px}.prd-dialog{max-height:96vh}.prd-code{grid-template-columns:1fr}.prd-body{padding:14px}.prd-dialog h2{font-size:16px}}
  .metrics,.mobile-stat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.metric{height:60px}.mobile-stat-grid{padding:14px 7px}.survey-list h3,.latest h3{font-size:13px;color:#435562;margin:10px 0 4px}.survey-row,.survey-head{grid-template-columns:minmax(0,1fr) 76px 86px 85px;gap:8px}.survey-row{min-height:52px}.track{min-width:40px}.latest{padding:0 16px 8px}.latest a{display:flex;flex-direction:column;gap:7px;padding:13px 0;border-top:1px solid #edf0f2}.latest a b{font-size:13px;line-height:1.5}.latest a span{font-size:11px;color:#839097}</style>
  <style>.latest a b{display:flex;align-items:center;justify-content:space-between;gap:8px}.latest .status{flex:none;padding:2px 6px;border-radius:8px;background:#eef5ff;color:#2468b5;font-size:10px;font-style:normal}.latest .status.not-started{background:#fff5e6;color:#b56b12}</style>

<body>
<div class="showcase">
  <header class="toolbar">
    <div class="brand"><i>调</i><div>问卷调研首页组件<small>教育局端 / 学校端 · PC / 移动端</small></div></div>
    <div class="switches">
      <div class="segmented" aria-label="组织端切换"><button class="active" data-portal="bureau">教育局端</button><button data-portal="school">学校端</button></div>
      <div class="segmented" aria-label="设备切换"><button class="active" data-device="pc">PC端</button><button data-device="mobile">移动端</button></div>
    </div>
  </header>
  <main class="workspace">
    <div class="preview-title"><div><h1 id="page-title">教育局端 · PC 首页组件</h1><p id="page-subtitle">两项统计与最新五条问卷</p></div><span id="org-label">临江县教育局</span></div>
    <section class="panel active" data-key="bureau-pc"></section>
    <section class="panel" data-key="school-pc"></section>
    <section class="panel" data-key="bureau-mobile"></section>
    <section class="panel" data-key="school-mobile"></section>
    <p class="hint" id="page-hint">点击问卷或“查看更多”可进入现有问卷调研演示页面。</p>
  </main>
</div>
<div class="prd-mask" id="prd-mask" role="dialog" aria-modal="true" aria-label="问卷调研首页统计组件数据与后端实现规则"></div>
<script>
const DATA={"bureau":{"name":"教育局端","org":"临江县教育局","metrics":["128","18"],"surveys":[[34,"家长委员会年度意见汇总","学校家委会及外部家长代表","37/72",51,"2026-09-12","进行中"],[33,"校园安全隐患每日排查","全县72所学校安全员","0/72",0,"2026-09-17","进行中"],[32,"家校协同公开意见补充征集","学生家长及社会公众","累计 88 份",null,"2026-09-12","进行中"],[31,"教育信息化每日进展填报","信息中心与学校信息员","12/86",14,"2026-09-13","进行中"],[30,"秋季教研工作启动确认","教研室全员","0/46",0,"2026-09-15","未开始"]]},"school":{"name":"学校端","org":"临江县实验学校","metrics":["64","8"],"surveys":[[44,"家校协同年度意见汇总","家委会及校外家长代表","54/126",43,"2026-09-12","进行中"],[43,"校园安全隐患每日排查","班主任及后勤人员","0/48",0,"2026-09-17","进行中"],[42,"校园服务公开意见补充征集","学生家长及校外访客","累计 76 份",null,"2026-09-12","进行中"],[41,"课堂教学每日观察记录","全校教师","28/126",22,"2026-09-13","进行中"],[40,"新学期班级信息确认","全校班主任","0/36",0,"2026-09-15","未开始"]]}};
let portal='bureau',device='pc';
const page=(p)=>p==='bureau'?'bureau.html':'school.html';
function progress(rate){return rate===null?'<span class="public">公开收集</span>':`<div class="rate"><div class="track"><i style="width:${rate}%"></i></div><b>${rate}%</b></div>`}
function pc(p){const d=DATA[p];return `<div class="pc-stage"><article class="pc-widget"><header class="widget-head"><h2>问卷调研</h2><div class="widget-actions"><button class="prd-btn" data-prd="${p}" data-prd-device="pc">prd</button><a href="${page(p)}#all-surveys">查看更多 &gt;</a></div></header><div class="widget-main"><aside class="metrics">${[['问卷总数',d.metrics[0]],['进行中问卷',d.metrics[1]]].map(x=>`<a class="metric" href="${page(p)}#all-surveys"><span>${x[0]}</span><b>${x[1]}</b></a>`).join('')}</aside><div class="survey-list"><h3>最新问卷</h3><div class="survey-head"><span>问卷名称</span><span>提交进度</span><span>完成率</span><span>截止时间</span></div>${d.surveys.slice(0,5).map(s=>`<a class="survey-row" href="${page(p)}#stats/detail/${s[0]}"><span class="name" title="${s[1]}｜${s[2]}">${s[1]}</span><span>${s[3]}</span><span>${progress(s[4])}</span><span>${s[5]}</span></a>`).join('')}</div></div></article><div class="pc-placeholder"><b>其他首页组件</b><span>等宽组件占位</span></div></div>`}
function mobile(p){const d=DATA[p],rows=d.surveys.slice(0,5);return `<div class="mobile-stage"><div class="mobile-org"><small>云平台首页 · ${d.name}</small><b>${d.org}</b></div><div class="mobile-title-row"><h2 class="mobile-title">问卷调研</h2><button class="prd-btn" data-prd="${p}" data-prd-device="mobile">prd</button></div><p class="mobile-explain">问卷运行统计</p><div class="mobile-card stats-only" aria-label="问卷调研统计数据"><div class="mobile-stat-grid"><div><b>${d.metrics[0]}</b><span>问卷总数</span></div><div><b>${d.metrics[1]}</b><span>进行中问卷</span></div></div><div class="latest"><h3>最新问卷</h3>${rows.length?rows.map(s=>`<a href="${page(p)}#stats/detail/${s[0]}" data-mobile-survey-link data-portal-target="${p}" data-survey-id="${s[0]}"><b>${s[1]}<em class="status ${s[6]==='未开始'?'not-started':''}">${s[6]}</em></b><span>截止时间：${s[5]}</span></a>`).join(''):'<div class="public">暂无问卷</div>'}</div></div><section class="placeholder"><h2>常用应用</h2><div></div></section></div>`}
document.querySelector('[data-key="bureau-pc"]').innerHTML=pc('bureau');document.querySelector('[data-key="school-pc"]').innerHTML=pc('school');document.querySelector('[data-key="bureau-mobile"]').innerHTML=mobile('bureau');document.querySelector('[data-key="school-mobile"]').innerHTML=mobile('school');
function widgetTrack(event,details={}){window.__prdEvents=window.__prdEvents||[];window.__prdEvents.push({event,portal,device,timestamp:new Date().toISOString(),...details})}
function render(){document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.dataset.key===`${portal}-${device}`));document.querySelectorAll('[data-portal]').forEach(x=>x.classList.toggle('active',x.dataset.portal===portal));document.querySelectorAll('[data-device]').forEach(x=>x.classList.toggle('active',x.dataset.device===device));document.getElementById('page-title').textContent=`${DATA[portal].name} · ${device==='pc'?'PC':'移动端'}首页组件`;document.getElementById('page-subtitle').textContent='两项统计与最新五条问卷';document.getElementById('org-label').textContent=DATA[portal].org;document.getElementById('page-hint').textContent=device==='pc'?'点击问卷或“查看更多”进入问卷统计。':'点击问卷进入统计详情。';widgetTrack('cloud_widget_open')}
document.querySelectorAll('[data-portal]').forEach(b=>b.addEventListener('click',()=>{portal=b.dataset.portal;render()}));document.querySelectorAll('[data-device]').forEach(b=>b.addEventListener('click',()=>{device=b.dataset.device;render()}));document.querySelectorAll('[data-mobile-survey-link]').forEach(link=>link.addEventListener('click',()=>{sessionStorage.setItem('survey-preview','mobile');widgetTrack('survey_widget_entry_click',{portal:link.dataset.portalTarget,survey_id:link.dataset.surveyId,target_route:link.getAttribute('href')})}));render();
function prdTable(headers,rows){return `<table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
openPrd=function(p,dev){
 const mask=document.getElementById('prd-mask'),features=[
  ['应用导航','删除应用内首页','教育局端、学校端应用内不保留首页菜单；默认进入我的问卷，旧首页地址重定向我的问卷。','P0','两端一致'],
  ['云首页','顶部统计','PC 与移动端均仅展示问卷总数和进行中问卷数；未开始问卷不计入进行中。','P0','同一组织快照'],
  ['云首页','PC 最新问卷','展示当前组织最新五条已发布问卷，包含未开始、进行中、暂停及结束；点击进入统计详情。','P0','按创建时间、ID 倒序'],
  ['云首页','移动最新问卷','展示当前组织最新五条已发布问卷、状态和截止时间；点击进入统计详情。','P0','两端移动端一致'],
   ['PRD 文档','版本与关闭','展示 PRD V1.8 更新日期；按钮、遮罩和 Escape 关闭后不改变页面状态。','P1','2026-09-07']
 ];
  mask.dataset.portal=p;mask.dataset.device=dev;mask.innerHTML=`<article class="prd-dialog"><header><div><small>${p==='bureau'?'教育局端':'学校端'} · ${dev==='pc'?'PC':'移动端'}</small><h2>云首页组件规则</h2></div><button class="prd-close" aria-label="关闭">×</button></header><div class="prd-body"><p class="prd-note"><b>PRD V1.8</b> · 更新日期 2026-09-07</p><section><h3>1. 背景与目标</h3><p>删除教育局端、学校端应用内首页，统一由云首页提供精简问卷统计和快捷入口。</p></section><section><h3>2. 用户与使用场景</h3><p>教育局与学校授权用户在 PC 云首页查看组织问卷概览，在移动云首页查看当前组织最新问卷。</p></section><section><h3>3. 需求范围</h3><h4>In Scope</h4><p>两项统计、PC 最新五条问卷、移动端最新五条问卷、截止日期、页面跳转及 PRD 入口。</p><h4>Out of Scope</h4><p>移动端填写列表、问卷创建表单、其他页面字段、后端接口及数据库实现。</p></section><section><h3>4. 功能需求列表</h3>${prdTable(['功能模块','功能点','需求描述','优先级（P0 / P1 / P2）','备注说明'],features)}</section><section><h3>5. 核心流程与交互说明</h3><p>进入云首页后加载组织统计。PC 与移动端均展示当前组织最新五条问卷并进入统计详情；PC 查看更多进入全部问卷。</p></section><section><h3>6. 异常场景与边界条件</h3><p>PC 不足五条按实际数量展示；移动端无已发布问卷时展示“暂无问卷”。截止日期无法识别时展示“—”；加载失败或无权限不得展示为零。</p></section><section><h3>7. 数据口径与埋点需求</h3><p>问卷总数包含当前组织未删除草稿；进行中仅计 status=running。PC 最新问卷排除草稿，按 createdAt、ID 倒序取五条。移动端与 PC 均排除草稿和已删除问卷，按 createdAt、ID 倒序取五条。记录 cloud_widget_open、survey_widget_entry_click、prd_entry_expose、prd_rule_open 和 prd_rule_close；【假设】公共属性包含 portal、device、org_id、user_id、survey_id、timestamp。</p></section><section><h3>8. 风险、依赖与限制</h3><p>正式环境依赖组织权限、个人答卷状态和聚合接口；缓存必须隔离组织、用户及权限范围。生产数据使用独立 deadline 字段。</p></section><section><h3>9. 验收标准</h3><p>PC 与移动端仅展示两项统计；PC 最新问卷不超过五条且进入统计详情；移动端最新问卷不超过五条且进入统计详情；截止日期含年份；无数据展示正确空态。</p></section></div></article>`;
